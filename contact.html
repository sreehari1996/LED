<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Lumina Network</title>
    <link href="./style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#030303] text-white font-inter">
    <div class="noise-overlay"></div>
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="bg-glow-1 absolute top-[20%] left-[20%] w-[600px] h-[600px] rounded-full bg-purple-600/10 blur-[150px]"></div>
    </div>

    <nav class="fixed w-full z-50 transition-all duration-500 py-6 border-b border-transparent" id="navbar">
        <div class="max-w-[1400px] mx-auto px-6 md:px-12 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-outfit font-black tracking-widest text-white">LUMINA</a>
            <div class="hidden lg:flex gap-8 text-sm font-medium text-gray-400">
                <a href="index.html" class="hover:text-white transition-colors tracking-wide uppercase text-xs">Home</a>
                <a href="index.html#solutions" class="hover:text-white transition-colors tracking-wide uppercase text-xs">LED Solutions</a>
                <a href="advertise.html" class="hover:text-white transition-colors tracking-wide uppercase text-xs">Advertise</a>
                <a href="network.html" class="hover:text-white transition-colors tracking-wide uppercase text-xs">Our Screens</a>
                <a href="projects.html" class="hover:text-white transition-colors tracking-wide uppercase text-xs">Projects</a>
                <a href="contact.html" class="text-white transition-colors tracking-wide uppercase text-xs">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Dynamic Form Section (Section 17) -->
    <section class="min-h-screen pt-40 pb-24 relative z-10 flex items-center justify-center">
        <div class="max-w-4xl w-full mx-auto px-6 md:px-12 stagger-section">
            <div class="text-center mb-16 sec-title">
                <h1 class="text-5xl md:text-7xl font-outfit font-black mb-6">Let's <span class="text-gradient">Talk</span></h1>
                <p class="text-gray-400 text-lg font-light max-w-xl mx-auto">Select your interest below and we'll guide you to the right team.</p>
            </div>
            
            <div class="glass-panel p-8 md:p-12 rounded-3xl glow-border stagger-card">
                <form class="space-y-8">
                    <!-- Step 1: Intent -->
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-4">What are you looking for?</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <label class="border border-white/10 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-colors has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10">
                                <input type="radio" name="intent" class="hidden" checked>
                                <div class="w-4 h-4 rounded-full border border-gray-500 flex-shrink-0 flex items-center justify-center bg-blue-500"><div class="w-2 h-2 rounded-full bg-[#030303]"></div></div>
                                <span class="text-sm font-semibold">I need a custom LED Wall</span>
                            </label>
                            <label class="border border-white/10 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-colors has-[:checked]:border-purple-500 has-[:checked]:bg-purple-500/10">
                                <input type="radio" name="intent" class="hidden">
                                <div class="w-4 h-4 rounded-full border border-gray-500 flex-shrink-0"></div>
                                <span class="text-sm font-semibold">I want to Advertise</span>
                            </label>
                            <label class="border border-white/10 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-colors has-[:checked]:border-pink-500 has-[:checked]:bg-pink-500/10">
                                <input type="radio" name="intent" class="hidden">
                                <div class="w-4 h-4 rounded-full border border-gray-500 flex-shrink-0"></div>
                                <span class="text-sm font-semibold">I have a Property Location</span>
                            </label>
                            <label class="border border-white/10 rounded-xl p-4 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-colors has-[:checked]:border-blue-500 has-[:checked]:bg-blue-500/10">
                                <input type="radio" name="intent" class="hidden">
                                <div class="w-4 h-4 rounded-full border border-gray-500 flex-shrink-0"></div>
                                <span class="text-sm font-semibold">Agency Enquiry</span>
                            </label>
                        </div>
                    </div>

                    <!-- Step 2: Dynamic Fields (Simulated for LED Wall) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-white/10">
                        <div>
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">First Name</label>
                            <input type="text" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Last Name</label>
                            <input type="text" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Company / Organization</label>
                            <input type="text" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-blue-500 transition-colors">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Project Description & Dimensions</label>
                            <textarea rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-sm focus:outline-none focus:border-blue-500 transition-colors"></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Upload Site Photos (Optional)</label>
                            <div class="w-full border-2 border-dashed border-white/10 rounded-xl p-8 text-center hover:border-white/30 transition-colors cursor-pointer">
                                <p class="text-sm text-gray-500">Drag & drop files or <span class="text-blue-400">browse</span></p>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="w-full py-4 rounded-xl text-sm font-semibold uppercase tracking-widest bg-white text-black hover:bg-gray-200 transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                        Submit Enquiry
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
